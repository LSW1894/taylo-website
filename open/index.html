<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apri in Taylo</title>
<meta name="description" content="Qualcuno ha condiviso qualcosa con te su Taylo, il social per chi ama gli animali. Aprilo nell'app o scaricala gratis." />

<!-- Anteprima link (WhatsApp, Telegram, iMessage…) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Taylo" />
<meta property="og:title" content="Guarda su Taylo 🐾" />
<meta property="og:description" content="Il social per chi ama gli animali: post, adozioni e professionisti vicino a te. Scarica Taylo, è gratis." />
<meta property="og:image" content="https://taylo.it/logo.png" />
<meta name="twitter:card" content="summary" />
<meta name="robots" content="noindex" />

<link rel="icon" type="image/png" href="../logo.png" />
<link rel="apple-touch-icon" href="../logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />

<style>
  /* Palette "Prato" — identica all'app (constants/theme.ts) */
  :root {
    --bg: #F5F1EB; --surface: #FFFFFF; --surface2: #F0EBE2;
    --text: #18140F; --text-muted: #6A5E4D;
    --primary: #2A5724; --primary-hover: #1E4019; --primary-light: #C4DCC0;
    --accent: #E8A030; --on-primary: #FFFFFF;
    --shadow: 0 26px 70px rgba(24, 20, 15, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D0F0C; --surface: #151714; --surface2: #191C18;
      --text: #E4EBE0; --text-muted: #93A38C;
      --primary: #50AC49; --primary-hover: #3F9038; --primary-light: #142212;
      --on-primary: #0D0F0C;
      --shadow: 0 26px 70px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .blob { position: fixed; border-radius: 50%; background: var(--primary-light); opacity: .55; z-index: 0; }
  .blob.a { width: 340px; height: 340px; right: -120px; bottom: -80px; }
  .blob.b { width: 90px; height: 90px; right: 170px; bottom: 230px; }
  .blob.c { width: 76px; height: 76px; right: 60px; bottom: 290px; }
  .blob.d { width: 200px; height: 200px; left: -90px; top: 60px; opacity: .3; }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    background: var(--surface); border-radius: 36px;
    padding: 36px 28px 28px; text-align: center;
    box-shadow: var(--shadow);
  }
  .logo {
    width: 84px; height: 84px; border-radius: 28px; margin: 0 auto 22px;
    transform: rotate(-6deg); box-shadow: 0 10px 30px rgba(42, 87, 36, .25);
    display: block;
  }
  .kicker {
    display: inline-block; margin-bottom: 14px;
    padding: 6px 14px; border-radius: 999px;
    background: var(--surface2); color: var(--text-muted);
    font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  }
  .kicker.adoption { background: var(--accent); color: #18140F; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 32px; line-height: 1.1; letter-spacing: -.01em; }
  h1 em { font-style: normal; font-weight: 600; color: var(--primary); }
  p.lead { margin-top: 12px; color: var(--text-muted); font-size: 16px; line-height: 1.55; }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 54px; padding: 0 22px; border-radius: 999px;
    font-family: inherit; font-weight: 700; font-size: 16px; text-decoration: none;
    border: none; cursor: pointer; transition: transform .15s ease, background .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-primary:hover { background: var(--primary-hover); }
  .stores { display: flex; gap: 10px; }
  .btn-store { flex: 1; background: var(--surface2); color: var(--text); font-size: 15px; }
  .btn-store svg { width: 18px; height: 18px; flex-shrink: 0; }
  .hint { margin-top: 18px; font-size: 13px; color: var(--text-muted); }
  .hint a { color: var(--primary); font-weight: 700; text-decoration: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="blob d"></div>

  <main class="card">
    <img class="logo" src="../logo.png" alt="Taylo" width="84" height="84" />
    <span id="kicker" class="kicker">Su Taylo</span>
    <h1 id="title">Qualcuno ha condiviso<br /><em>qualcosa con te</em></h1>
    <p id="lead" class="lead">Aprilo in Taylo, il social per chi ama gli animali. Se non hai ancora l'app, scaricala: è gratis.</p>

    <div class="actions">
      <a id="open" class="btn btn-primary" href="#">Apri in Taylo</a>
      <div class="stores">
        <a id="ios" class="btn btn-store" href="https://apps.apple.com/app/id6795193969" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.87-.76-1.47.02-2.83.86-3.59 2.18-1.53 2.66-.39 6.6 1.1 8.75.73 1.05 1.6 2.24 2.73 2.2 1.1-.05 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.32-3.5zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.68-.92 2.67.97.08 1.96-.49 2.56-1.22z"/></svg>
          App Store
        </a>
        <a id="android" class="btn btn-store" href="https://play.google.com/store/apps/details?id=com.lsw1894.taylo" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1l9.7-9.7-9.7-9.7zm10.7 10.7 2.7 2.7-11.4 6.5 8.7-9.2zm3.8-1 3 1.7c.8.5.8 1.2 0 1.6l-3.1 1.8-2.9-2.9 3-2.2zM5.6 1.8 17 8.3l-2.7 2.7-8.7-9.2z"/></svg>
          Google Play
        </a>
      </div>
    </div>
    <p class="hint">Scopri di più su <a href="https://taylo.it">taylo.it</a></p>
  </main>

<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var kinds = [
      { param: 'post', path: 'post/', kicker: 'Post', title: 'Un post da<br /><em>non perdere</em>', lead: "Qualcuno ha condiviso con te un post su Taylo. Aprilo nell'app per lasciare una zampa e commentare." },
      { param: 'adoption', path: 'adoptions/', kicker: 'Cerca casa', title: 'C’è un amico che<br /><em>cerca famiglia</em>', lead: "Guarda l'annuncio di adozione su Taylo: foto, carattere, dove si trova e come fare richiesta." },
      { param: 'pro', path: 'professionals/', kicker: 'Professionista', title: 'Un esperto<br /><em>consigliato per te</em>', lead: 'Servizi, recensioni e contatti diretti: guarda la scheda su Taylo.' }
    ];
    var found = null, id = null;
    for (var i = 0; i < kinds.length; i++) {
      var v = q.get(kinds[i].param);
      if (v && /^[A-Za-z0-9-]{1,64}$/.test(v)) { found = kinds[i]; id = v; break; }
    }

    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var playUrl = 'https://play.google.com/store/apps/details?id=com.lsw1894.taylo';
    var appStoreUrl = 'https://apps.apple.com/app/id6795193969';

    if (found) {
      document.getElementById('kicker').textContent = found.kicker;
      if (found.param === 'adoption') document.getElementById('kicker').classList.add('adoption');
      document.getElementById('title').innerHTML = found.title;
      document.getElementById('lead').textContent = found.lead;
    }

    // Mostra prima lo store giusto
    if (isIOS) document.getElementById('android').classList.add('hidden');
    if (isAndroid) document.getElementById('ios').classList.add('hidden');

    var path = found ? found.path + encodeURIComponent(id) : '';
    var openBtn = document.getElementById('open');

    if (isAndroid) {
      // Intent: apre l'app se c'è, altrimenti Chrome va direttamente sul Play Store
      openBtn.href = 'intent://' + path + '#Intent;scheme=taylo;package=com.lsw1894.taylo;S.browser_fallback_url=' + encodeURIComponent(playUrl) + ';end';
    } else {
      openBtn.href = 'taylo://' + path;
      if (isIOS) {
        openBtn.addEventListener('click', function () {
          // App non installata: dopo un attimo, ancora qui → App Store
          var t = setTimeout(function () { if (!document.hidden) location.href = appStoreUrl; }, 1600);
          document.addEventListener('visibilitychange', function () { if (document.hidden) clearTimeout(t); });
        });
      } else {
        // Desktop: niente app da aprire, mostra il sito
        openBtn.href = 'https://taylo.it';
        openBtn.textContent = 'Scopri Taylo';
      }
    }
  })();
</script>
</body>
</html>
